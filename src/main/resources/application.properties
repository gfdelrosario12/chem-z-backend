# =======================
# Application
# =======================
spring.application.name=chemz-lms
server.port=8080

# =======================
# Email Configuration (Gmail SMTP)
# =======================
app.email=${APP_EMAIL}
app.password=${APP_PASSWORD}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${APP_EMAIL}
spring.mail.password=${APP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ? CRITICAL: Prevent API hanging on DigitalOcean
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Optional but recommended
spring.mail.default-encoding=UTF-8

# =======================
# Database Configuration (PostgreSQL - DigitalOcean)
# =======================
spring.datasource.url=jdbc:postgresql://ep-orange-dream-aiid5i32-pooler.c-4.us-east-1.aws.neon.tech:5432/neondb?sslmode=require&channel_binding=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# =======================
# JWT Configuration
# =======================
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# =======================
# AWS Configuration
# =======================
aws.access-key=${AWS_ACCESS_KEY_ID}
aws.secret-key=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION:ap-southeast-1}

# =======================
# Logging (Helpful for Email Debugging)
# =======================
logging.level.org.springframework.mail=INFO
logging.level.org.springframework.mail.javamail=INFO
logging.level.org.apache.commons.mail=INFO

# Uncomment ONLY when debugging SMTP
# logging.level.org.springframework.mail.javamail=DEBUG
# logging.level.org.eclipse.angus.mail=DEBUG

# =======================
# Jackson / API
# =======================
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# =======================
# Actuator (optional)
# =======================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
